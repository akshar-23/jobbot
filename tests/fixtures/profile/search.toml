# Company-specific rules. Amazon's software category is too broad: only titles starting with
# these pass, and only with a new-grad signal in the title or description.
[[company_rules]]
company = "Amazon"
title_starts_with = [
    'software\s+(?:development|dev|developer)?\s*engineer',
    'sde\b',
    'applied\s+scientist',
    '(?:machine\s+learning|ml)\s+engineer',
    'research\s+scientist',
    'research\s+engineer',
    'data\s+scientist',
    'front[\s-]?end\s+engineer',
]
require_new_grad_signal = true

[sources]
# The SimplifyJobs New-Grad list (software roles). Turn off for other professions.
simplify_new_grad = true
simplify_categories = ["Software", "Software Engineering", "AI/ML/Data"]

# Location order for ranking: first is best. Remote and other US places rank after these.

[[locations]]
name = "SF Bay Area"
match = 'san francisco|\bsf\b|bay area|palo alto|mountain view|menlo park|sunnyvale|san jose|santa clara|redwood city|san mateo|oakland|cupertino|foster city|burlingame|berkeley|emeryville|fremont|milpitas|los gatos|san bruno'

[[locations]]
name = "Boston"
match = '\bboston\b|\bcambridge,?\s*(ma|massachusetts)\b|\bsomerville\b|\bwaltham\b|\bmassachusetts\b|,\s*ma\b'

[[locations]]
name = "NYC"
match = '\bnew york\b|\bnyc\b|\bbrooklyn\b|\bmanhattan\b|,\s*ny\b'

[[locations]]
name = "Seattle"
match = '\bseattle\b|\bbellevue\b|\bredmond\b|\bkirkland\b|\bbothell\b|,\s*wa\b'

[fit]
# What the fit check (Claude) weighs, in plain words. {years} and {years_plus} are filled in
# from max_years_required. Write it about yourself in the third person.
guide = '''
What the candidate is looking for: full-time US software engineering, ML engineering or game
programming roles at new-grad, entry, level I or level II. MS, not a PhD. Needs H-1B sponsorship.

Verdicts:
- good: the level fits ({years} years or fewer asked) and the must-haves match the facts.
- stretch: the level fits but one core must-have is missing, or {years_plus} years asked.
- poor: more than {years_plus} years required, senior scope, a PhD required, a specialist domain
  the facts don't show, sponsorship ruled out, or not a software role.
'''
