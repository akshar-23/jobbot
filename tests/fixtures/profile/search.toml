# What to look for and how to judge it. Read by the nightly scraper, the dashboard and the fit
# check; the setup wizard (dashboard → Profile) writes it, and you can edit it by hand.
# Title patterns are regular expressions matched as whole words, ignoring case.

[target]
# Levels: titles levelled above max_level are dropped (III, IV…, and Microsoft IC3+ when it's 2).
# level_nouns are the words a level number follows ("Engineer III", "SDE 3").
max_level = 2
level_nouns = ["engineer", "sde", "scientist", "developer", "programmer"]
# Postings asking more years than this are dropped (unless they also invite new grads).
max_years_required = 3
drop_manager_titles = true
drop_lead_titles = true
drop_phd_roles = true            # PhD-only and postdoc titles
drop_contract_roles = true       # titles marked contract / contractor
drop_apprenticeships = true      # apprentice / apprenticeship titles

[titles]
# A title must contain one of these to be considered.
include = [
    'engineer',
    'engineering',
    'developer',
    'programmer',
    'scientist',
    'sde',
    'sre',
    'researcher',
    'machine\s*learning',
    'gameplay',
    'graphics',
    'robotics',
]
# Not the kind of job you're after (other professions, customer-facing engineering…).
not_target = [
    'artist',
    'designer',
    'producer',
    'marketing',
    'sales',
    'recruiter',
    'hr',
